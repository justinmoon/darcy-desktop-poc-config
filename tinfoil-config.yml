cvm-version: 0.14.16
cpus: 2
memory: 8192
networks:
  desktop:
    egress: allowlist
    allow: [example.com]
containers:
  - name: desktop
    image: ghcr.io/justinmoon/darcy-desktop-poc-config@sha256:8f4bb2ec91cd2248af3adf0c48e5eb887dd12acc8ceaecd2671de70b02ac5949
    cvm_admin: true
    user: "0:0"  # Bootstrap drops all privileges before threads/API/desktop.
    read_only: true
    pids_limit: 512
    shm_size: 512m
    networks: [desktop]
    env:
      - DESKTOP_BOOTSTRAP_USERNS: "1"
      - DESKTOP_OWNER_SHA256: "f64cf4f57f7e82e5d06af5a98e0a8d1c342ca917f8c295a0a7a33e7b2c031b6d"
    tmpfs:
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /home/desktop: rw,nosuid,nodev,size=2g,mode=700,uid=1000,gid=1000
shim:
  upstream-port: 8080
  authenticated: false
  paths: [/api, /healthz]
