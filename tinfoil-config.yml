cvm-version: 0.14.16
cpus: 2
memory: 8192
networks:
  desktop:
    egress: allowlist
    allow: [example.com]
containers:
  - name: desktop
    image: ghcr.io/justinmoon/darcy-desktop-poc-config@sha256:8d7a720d93e4369907a9089283d20cce65d87893cce892ce8567216cf93054bd
    user: "1000:1000"
    read_only: true
    pids_limit: 512
    shm_size: 512m
    networks: [desktop]
    env:
      - DESKTOP_OWNER_SHA256: "f64cf4f57f7e82e5d06af5a98e0a8d1c342ca917f8c295a0a7a33e7b2c031b6d"
    tmpfs:
      /tmp: rw,nosuid,nodev,size=1g,mode=1777
      /home/desktop: rw,nosuid,nodev,size=2g,mode=700,uid=1000,gid=1000
shim:
  upstream-port: 8080
  authenticated: false
  paths: [/api, /healthz]
